<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>ETI lead forms</title></head>
  <body>
    <form name="eti-leads-courses" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="eti-leads-courses">
      <input name="bot-field">
      <input name="subject">
      <input name="Lead source">
      <input name="Form">
      <input name="Name"><input name="Email"><input name="Phone"><textarea name="Message"></textarea><input name="Consent">
      <input name="Programme"><input name="Organisation">
      <input name="Best contact time"><input name="Learning mode"><input name="Location">
      <input name="Group size"><input name="Preferred delivery"><input name="Training category">
      <textarea name="Requirements"></textarea>
      <input name="Country"><input name="Current role or organisation">
      <input name="Highest qualification"><textarea name="Learning objective"></textarea><input name="Nationality">
      <input name="Preferred learning mode"><input name="Preferred start date">
    </form>
    <form name="eti-leads-programs" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="eti-leads-programs">
      <input name="bot-field"><input name="subject"><input name="Lead source"><input name="Form">
      <input name="Name"><input name="Email"><input name="Phone"><input name="Organisation"><input name="Programme">
      <textarea name="Requirements"></textarea><input name="Consent">
    </form>
  </body>
</html>
